name: Android CI Build Magisk Module

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # บิวด์ Gradle tasks ตามคำสั่ง :module:assemble<Flavor><BuildType>
      - name: Build with Gradle
        run: |
          ./gradlew :module:assembleZygiskRelease
          ./gradlew :module:assembleZygiskDebug

      - name: Build Riru Release & Debug
        run: |
          ./gradlew :module:assembleRiruRelease
          ./gradlew :module:assembleRiruDebug

      # อัปโหลดไฟล์ Magisk module ZIP ที่ได้จากโฟลเดอร์ out
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sui-Magisk-Modules
          path: out/*.zip
          
